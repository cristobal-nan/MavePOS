appId: com.mave.pos
productName: POS Offline
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: POS Offline
  runAfterFinish: true
