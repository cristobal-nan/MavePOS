<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Offline</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('app_surface_mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-surface', 'dark');
          }
          var theme = localStorage.getItem('app_theme') || 'lila';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 select-none overflow-hidden h-screen w-screen">
    <div id="root" class="h-full w-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
